<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES OF THE ABYSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <!-- Игровой контейнер -->
    <div id="game-container"></div>

    <!-- UI СЛОЙ -->
    <div id="ui-layer">
        
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="main-menu" class="screen active">
            <h1 class="glitch" data-text="ECHOES OF THE ABYSS">ECHOES OF THE ABYSS</h1>
            <div class="menu-content">
                <button id="btn-new-game" class="menu-btn">NEW GAME</button>
                <button id="btn-continue" class="menu-btn" disabled>CONTINUE</button>
                <button id="btn-settings" class="menu-btn">SETTINGS</button>
                <button id="btn-exit" class="menu-btn">EXIT</button>
            </div>
            <div class="version">v1.0.0 | AAA WEB BUILD</div>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-menu" class="screen hidden">
            <h2>SETTINGS</h2>
            <div class="settings-group">
                <label>Graphics Quality</label>
                <select id="set-quality">
                    <option value="low">LOW (Performance)</option>
                    <option value="medium" selected>MEDIUM</option>
                    <option value="high">HIGH (Ultra)</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Mouse Sensitivity</label>
                <input type="range" id="set-sensitivity" min="0.5" max="3.0" step="0.1" value="1.5">
            </div>
            <div class="settings-group">
                <label>Master Volume</label>
                <input type="range" id="set-volume" min="0" max="1" step="0.1" value="0.8">
            </div>
            <button id="btn-back-settings" class="menu-btn">BACK</button>
        </div>

        <!-- HUD (ИНТЕРФЕЙС В ИГРЕ) -->
        <div id="hud" class="hidden">
            <div class="hud-top">
                <div id="objective-text">FIND 5 KEY FRAGMENTS</div>
            </div>
            <div class="hud-bottom">
                <div class="stat-box">
                    <span>HEALTH</span>
                    <div class="bar-container"><div id="health-bar" class="bar health"></div></div>
                </div>
                <div class="stat-box">
                    <span>STAMINA</span>
                    <div class="bar-container"><div id="stamina-bar" class="bar stamina"></div></div>
                </div>
                <div class="stat-box right">
                    <span>KEYS: <span id="keys-count">0</span>/5</span>
                </div>
            </div>
            <div id="crosshair">+</div>
            <div id="interaction-prompt" class="hidden">PRESS [E]</div>
        </div>

        <!-- ПАУЗА -->
        <div id="pause-menu" class="screen hidden">
            <h2>PAUSED</h2>
            <button id="btn-resume" class="menu-btn">RESUME</button>
            <button id="btn-save-quit" class="menu-btn">SAVE & QUIT</button>
        </div>

        <!-- ЭКРАН СМЕРТИ -->
        <div id="death-screen" class="screen hidden">
            <h1 style="color: darkred;">YOU DIED</h1>
            <p id="death-reason">Consumed by the darkness.</p>
            <button id="btn-respawn" class="menu-btn">TRY AGAIN</button>
            <button id="btn-death-menu" class="menu-btn">MAIN MENU</button>
        </div>

        <!-- ЭКРАН ПОБЕДЫ -->
        <div id="victory-screen" class="screen hidden">
            <h1 style="color: gold;">ESCAPED</h1>
            <p>You survived the abyss.</p>
            <p id="final-time">Time: 00:00</p>
            <button id="btn-victory-menu" class="menu-btn">MAIN MENU</button>
        </div>
    </div>

    <!-- СКРИПТЫ ИГРЫ (МОДУЛЬНАЯ СИСТЕМА) -->
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="audio.js"></script>
    <script src="save.js"></script>
    <script src="settings.js"></script>
    <script src="ui.js"></script>
    <script src="controls.js"></script>
    <script src="player.js"></script>
    <script src="enemy.js"></script>
    <script src="levels/level1.js"></script>
    <script src="main.js"></script>
</body>
</html>
