<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES OF DARKNESS: The Stalker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@400;700&display=swap');

        :root {
            --blood: #8a0000;
            --dark: #050505;
            --ui-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--dark);
            font-family: 'Roboto', sans-serif;
            color: #eee;
            user-select: none;
        }

        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        /* Menus */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--ui-bg);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 5rem; color: var(--blood);
            text-shadow: 0 0 20px red;
            margin: 0 0 20px 0; letter-spacing: 5px;
            animation: pulse 3s infinite;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--blood);
            color: #fff;
            padding: 15px 40px;
            font-size: 1.5rem;
            margin: 10px;
            cursor: pointer;
            font-family: 'Creepster', cursive;
            transition: all 0.3s;
            min-width: 250px;
            text-transform: uppercase;
        }
        .btn:hover { background: var(--blood); box-shadow: 0 0 20px var(--blood); transform: scale(1.05); }

        /* HUD */
        #hud {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none;
        }
        .stat-box {
            background: rgba(0,0,0,0.6);
            border-left: 4px solid var(--blood);
            padding: 10px 20px; min-width: 200px;
        }
        .bar-container { width: 100%; height: 8px; background: #333; margin-top: 5px; border-radius: 4px; overflow: hidden; }
        #health-fill { height: 100%; width: 100%; background: #d32f2f; transition: width 0.2s; }
        #stamina-fill { height: 100%; width: 100%; background: #ffca28; transition: width 0.1s; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 20; pointer-events: none;
        }

        #message-area {
            position: absolute; top: 20%; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 1.2rem;
            text-shadow: 0 2px 4px black;
            opacity: 0; transition: opacity 0.5s;
            text-align: center; z-index: 15;
        }

        /* Horror Effects */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px 50px black;
            pointer-events: none; z-index: 5;
            transition: box-shadow 0.2s;
        }
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.6);
            pointer-events: none; z-index: 6;
            opacity: 0; transition: opacity 0.2s;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 20px red; }
            50% { text-shadow: 0 0 40px red, 0 0 10px darkred; }
            100% { text-shadow: 0 0 20px red; }
        }
    </style>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="game-container"></div>
    
    <!-- Effects -->
    <div id="vignette"></div>
    <div id="damage-overlay"></div>
    <div id="crosshair"></div>
    <div id="message-area"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- Main Menu -->
        <div id="main-menu" class="screen interactive">
            <h1>ECHOES OF DARKNESS</h1>
            <p style="color: #aaa; margin-bottom: 30px;">Survival Horror Experience</p>
            <button class="btn" onclick="startGame()">New Game</button>
            <div style="margin-top: 20px; font-size: 0.8rem; color: #666;">
                WASD: Move | SHIFT: Run | F: Flashlight | E: Interact
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="screen interactive hidden">
            <h2 style="font-family: 'Creepster'; font-size: 3rem; color: #fff;">PAUSED</h2>
            <button class="btn" onclick="resumeGame()">Resume</button>
            <button class="btn" onclick="saveAndQuit()">Save & Quit</button>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="screen interactive hidden">
            <h1 style="color: darkred;">YOU DIED</h1>
            <p id="death-reason" style="font-size: 1.2rem; margin-bottom: 20px;">The Stalker caught you.</p>
            <button class="btn" onclick="resetGame()">Try Again</button>
            <button class="btn" onclick="showMainMenu()">Main Menu</button>
        </div>

        <!-- Victory -->
        <div id="victory-screen" class="screen interactive hidden">
            <h1 style="color: gold;">ESCAPED!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 20px;">You survived the nightmare.</p>
            <button class="btn" onclick="resetGame()">Play Again</button>
            <button class="btn" onclick="showMainMenu()">Main Menu</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="stat-box">
                <div style="font-size: 0.9rem; color: #aaa; text-transform: uppercase;">Health</div>
                <div class="bar-container"><div id="health-fill"></div></div>
                <div style="font-size: 0.9rem; color: #aaa; text-transform: uppercase; margin-top: 10px;">Stamina</div>
                <div class="bar-container"><div id="stamina-fill"></div></div>
            </div>
            
            <div class="stat-box" style="text-align: right; border-left: none; border-right: 4px solid gold;">
                <div style="font-size: 0.9rem; color: #aaa; text-transform: uppercase;">Keys</div>
                <div style="font-size: 1.5rem; font-weight: bold; color: gold;"><span id="keys-count">0</span>/5</div>
            </div>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="config.js"></script>
    <script src="enemy_system.js"></script>
    <script src="game_core.js"></script>
</body>
</html>
